name: CIM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Structural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository structure
        run: python3 tools/validate_system.py
      - name: Firmware contract
        run: python3 tools/validate_firmware_contract.py
      - name: Security posture
        run: python3 tools/validate_security.py
      - name: Pre-hardware readiness
        run: python3 tools/prehardware_readiness.py

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: detekt and ktlint
        run: ./gradlew detekt ktlintCheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        run: ./gradlew testAllModules

  apk:
    name: APK build and verification
    runs-on: ubuntu-latest
    needs: [analysis, test]
    defaults:
      run:
        working-directory: config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build all APKs
        run: ./gradlew buildAllApks
      - name: Stage APKs
        run: |
          mkdir -p ../android/apks
          find . -path '*/outputs/apk/*/*.apk' -exec cp {} ../android/apks/ \;
      - name: Validate and checksum APKs
        run: |
          ./gradlew validateApks
          ./gradlew writeApkChecksums
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            output-apks/*.apk
            output-apks/APK_CHECKSUMS.txt
