name: CIM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Structural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository structure
        run: python3 tools/validate_system.py
      - name: Firmware contract
        run: python3 tools/validate_firmware_contract.py
      - name: Security posture
        run: python3 tools/validate_security.py
      - name: Pre-hardware readiness
        run: python3 tools/prehardware_readiness.py

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: config
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: detekt and ktlint
        shell: bash
        run: |
          set -o pipefail
          status=0
          ./gradlew detekt 2>&1 | tee "$RUNNER_TEMP/static.log" || status=1
          curl -sSL -o "$RUNNER_TEMP/ktlint" https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x "$RUNNER_TEMP/ktlint"
          (
            cd "$GITHUB_WORKSPACE"
            "$RUNNER_TEMP/ktlint" --format \
              "android/*/src/main/kotlin/**/*.kt" \
              "android/*/src/test/kotlin/**/*.kt" \
              "config/**/*.kts" || true
            "$RUNNER_TEMP/ktlint" \
              "android/*/src/main/kotlin/**/*.kt" \
              "android/*/src/test/kotlin/**/*.kt" \
              "config/**/*.kts"
          ) 2>&1 | tee -a "$RUNNER_TEMP/static.log" || status=1
          if [ "$status" -ne 0 ]; then
            LOG="$RUNNER_TEMP/static.log"
            find .. -path '*reports/detekt*' -name '*.xml' -exec sh -c 'echo "=== $1"; grep -o "<error [^>]*>" "$1" || true' _ {} \; >> "$LOG" 2>/dev/null || true
            {
              echo "### Static analysis failed"
              echo '```'
              tail -n 120 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            MSG=$(grep -E 'What went wrong|^FAILURE:|^e: |error: |Caused by:|Could not|Unresolved|Lint error|\.kt:[0-9]+:[0-9]+:' "$LOG" | awk '!seen[$0]++' | head -400 | sed -e 's/%/%25/g' -e 's/\r//' | sed -e ':a' -e '$!N' -e 's/\n/%0A/g' -e 'ta')
            if [ -n "$MSG" ]; then
              echo "::error::$MSG"
            fi
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: config
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testAllModules 2>&1 | tee "$RUNNER_TEMP/tests.log" || {
            LOG="$RUNNER_TEMP/tests.log"
            {
              echo "### Unit tests failed"
              echo '```'
              tail -n 100 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E -A8 'What went wrong|^FAILURE:|^e: |error: |Caused by:|Could not|Unresolved|Lint error|\.kt:[0-9]+:[0-9]+:' "$LOG" | head -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

  apk:
    name: APK build and verification
    runs-on: ubuntu-latest
    needs: [analysis, test]
    defaults:
      run:
        working-directory: config
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Build all APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew buildAllApks 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            LOG="$RUNNER_TEMP/build.log"
            {
              echo "### APK build failed"
              echo '```'
              tail -n 100 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E -A8 'What went wrong|^FAILURE:|^e: |error: |Caused by:|Could not|Unresolved|Lint error|\.kt:[0-9]+:[0-9]+:' "$LOG" | head -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - name: Stage APKs
        run: |
          mkdir -p ../android/apks
          find . -path '*/outputs/apk/*/*.apk' -exec cp {} ../android/apks/ \;
      - name: Validate and checksum APKs
        shell: bash
        run: |
          set -o pipefail
          {
            ./gradlew validateApks
            ./gradlew writeApkChecksums
          } 2>&1 | tee "$RUNNER_TEMP/verify.log" || {
            LOG="$RUNNER_TEMP/verify.log"
            {
              echo "### APK validation failed"
              echo '```'
              tail -n 100 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E -A8 'What went wrong|^FAILURE:|^e: |error: |Caused by:|Could not|Unresolved|Lint error|\.kt:[0-9]+:[0-9]+:' "$LOG" | head -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            output-apks/*.apk
            output-apks/APK_CHECKSUMS.txt
